  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    identitySession:
      type: apiKey
      in: cookie
      name: cluster_identity_session
      description: HttpOnly, Secure identity-session cookie issued by `POST /identity/login`.
    documentsWorkerToken:
      type: apiKey
      in: header
      name: X-Documents-Worker-Token
      description: Internal document worker credential. It is never issued by this API.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Lowercase RFC 9562 UUIDv7 used for request, response, audit, and event correlation.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Classification:
      name: classification
      in: query
      schema:
        $ref: '#/components/schemas/Classification'
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    OrganizationUnitIdQuery:
      name: organization_unit_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    TemporaryAssignmentId:
      name: temporaryAssignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
        maxLength: 4096
    TemporaryAssignmentIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current X-Resource-Version value, not the weak ETag representation validator.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  headers:
    Correlation:
      description: Required request correlation value echoed by the service; lowercase RFC 9562 UUIDv7.
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    CsrfToken:
      description: CSRF proof issued with the identity session.
      required: true
      schema:
        type: string
        minLength: 1
    ETag:
      description: Strong entity version tag
      required: true
      schema:
        type: string
    CacheETag:
      description: Weak representation validator used with If-None-Match.
      required: true
      schema:
        type: string
        pattern: ^W/"[A-Za-z0-9._:-]+"$
    ResourceVersion:
      description: Strong lock version used as the If-Match value for temporary assignment changes.
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  responses:
    BadRequest:
      description: Invalid request (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Unauthorized:
      description: Authentication required or invalid (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Forbidden:
      description: Authorization denied (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    IdentitySession:
      description: Identity session authenticated by a Secure, HttpOnly cookie
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
        X-CSRF-Token:
          $ref: '#/components/headers/CsrfToken'
        Set-Cookie:
          schema:
            type: string
          description: Secure, HttpOnly identity-session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentitySessionResponse'
    Problem:
      description: RFC 7807 problem details
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    InternalServerError:
      description: Safe replay cannot be completed because persisted state is incomplete (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    CorrelationNoContent:
      description: Operation completed without a response body
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
    UnprocessableEntity:
      description: Semantically invalid request body (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    CurrentIdentity:
      description: Current identity account and session projection
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentIdentityResponse'
    IdentitySessionRevoked:
      description: Identity session revoked and its cookie expired
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
        Set-Cookie:
          schema:
            type: string
          description: Expired Secure, HttpOnly identity-session cookie.
    IdentityActivationIssued:
      description: Controlled activation issued without exposing its secret token
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdentityActivationIssued'
    Conflict:
      description: State or idempotency conflict (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Principal:
      description: Current principal
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/principal-context.schema'
    PreconditionFailed:
      description: If-Match does not match the current version (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Collection:
      description: Cursor-paginated authorized collection
      headers:
        Link:
          schema:
            type: string
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityCollection'
    Entity:
      description: Authorized typed resource representation
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Entity'
    DocumentUploadInitiated:
      description: Signed direct-upload intent for quarantine storage
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentUploadInitiated'
    NotFound:
      description: Resource not found or intentionally concealed (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    DocumentUploadStatus:
      description: Safe upload-status projection without storage object keys or AV implementation data
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentUploadStatus'
    DocumentUploadCompleted:
      description: Document upload completion accepted for scanning
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentUploadCompletion'
    DocumentVersionScan:
      description: Document version scan or promotion result
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentVersionScan'
    TemporaryAssignmentCollection:
      description: Cursor-paginated temporary assignments in one organization unit
