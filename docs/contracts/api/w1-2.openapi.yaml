openapi: 3.1.0
info:
  title: Cluster Platform W1.2 API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://cluster.example/legal
  description: Frozen W1.2 target contract. Operations marked implemented in the governed source are live; planned operations remain blocked until their delivery slice closes.
servers:
  - url: https://api.cluster.example/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Authenticate a W1.2 principal
      operationId: loginW12
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated W1.2 session
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/W12SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: planned
    post:
      summary: Revoke the current session
      operationId: logout
      responses:
        '204':
          description: Session revoked
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/login:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Authenticate and create an identity session
      operationId: identityLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/activation:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Consume an activation token and set an initial credential
      operationId: consumeIdentityActivation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityActivationRequest'
      responses:
        '204':
          $ref: '#/components/responses/CorrelationNoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/me:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Identity
      summary: Get the current identity session and account
      operationId: getCurrentIdentity
      security:
        - identitySession: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/logout:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Revoke the current identity session
      operationId: identityLogout
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/IdentitySessionRevoked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/password:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Change the current principal credential and revoke its session
      operationId: changeIdentityPassword
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityPasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/IdentitySessionRevoked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /identity/accounts/{accountId}/activation:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Issue a controlled activation for an account
      operationId: issueIdentityActivation
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/IdentityActivationIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Get the current principal
      operationId: getCurrentPrincipal
      responses:
        '200':
          $ref: '#/components/responses/Principal'
        '401':
          $ref: '#/components/responses/Problem'
  /me/scopes:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Identity
      summary: List scopes already allowed for the current principal
      operationId: listMyScopes
      responses:
        '200':
          description: Allowed and currently effective scopes
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeSelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/scope:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    put:
      tags:
        - Identity
      summary: Select one previously allowed effective scope without expanding access
      operationId: selectMyScope
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeSelectionUpdate'
      responses:
        '200':
          description: Effective scope selected
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /documents:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List authorized document metadata
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Classification'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create document metadata before uploading bytes
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/uploads:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Initiate a document upload
      operationId: initiateDocumentUpload
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadInitiateRequest'
      responses:
        '201':
          $ref: '#/components/responses/DocumentUploadInitiated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /documents/uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Get the authorized status of a document upload
      operationId: getDocumentUploadStatus
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentUploadStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /documents/uploads/{uploadId}/complete:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Complete a document upload
      operationId: completeDocumentUpload
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sha256
                - byte_size
              properties:
                sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                byte_size:
                  type: integer
                  minimum: 1
                  maximum: 1073741824
      responses:
        '202':
          $ref: '#/components/responses/DocumentUploadCompleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/documents/versions/{versionId}/scan:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Documents
        - Internal
      summary: Scan a quarantined document version
      operationId: scanDocumentVersion
      security:
        - documentsWorkerToken: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/DocumentVersionScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/documents/versions/{versionId}/reconcile-promotion:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Documents
        - Internal
      summary: Reconcile promotion of a scanned document version
      operationId: reconcileDocumentPromotion
      security:
        - documentsWorkerToken: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/DocumentVersionScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /organization/temporary-assignments:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization
      summary: List temporary assignments in an organization unit
      operationId: listTemporaryAssignments
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/OrganizationUnitIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/TemporaryAssignmentCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Organization
      summary: Create a temporary assignment
      operationId: createTemporaryAssignment
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemporaryAssignmentCreate'
      responses:
        '201':
          $ref: '#/components/responses/TemporaryAssignmentEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/Problem'
  /organization/temporary-assignments/{temporaryAssignmentId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization
      summary: Get a temporary assignment
      operationId: getTemporaryAssignment
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/TemporaryAssignmentId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/TemporaryAssignmentEntity'
        '304':
          $ref: '#/components/responses/TemporaryAssignmentNotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /organization/temporary-assignments/{temporaryAssignmentId}/revoke:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Organization
      summary: Revoke an active or scheduled temporary assignment
      operationId: revokeTemporaryAssignment
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/TemporaryAssignmentId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/TemporaryAssignmentIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      responses:
        '200':
          $ref: '#/components/responses/TemporaryAssignmentEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organization/cluster:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Get the singleton cluster root
      operationId: getCluster
      responses:
        '200':
          $ref: '#/components/responses/ClusterEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Create the singleton cluster root
      operationId: createCluster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreate'
      responses:
        '201':
          $ref: '#/components/responses/ClusterEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Update the singleton cluster profile
      operationId: updateCluster
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ClusterPatch'
      responses:
        '200':
          $ref: '#/components/responses/ClusterEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organization/facilities:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: List facilities
      operationId: listFacilities
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/FacilityCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Create a facility under the cluster
      operationId: createFacility
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
      responses:
        '201':
          $ref: '#/components/responses/FacilityEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /organization/facilities/{facilityId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Get a facility
      operationId: getFacility
      parameters:
        - name: facilityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/FacilityEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Update or archive a facility profile
      operationId: updateFacility
      parameters:
        - name: facilityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/FacilityPatch'
      responses:
        '200':
          $ref: '#/components/responses/FacilityEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organization/units:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: List organization units
      operationId: listOrganizationUnits
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: parent_id
          in: query
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationUnitCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Create an organization unit
      operationId: createOrganizationUnit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationNodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/OrganizationUnitEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organization/units/{unitId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      x-implementation-status: implemented
      summary: Get an organization unit and path
      operationId: getOrganizationUnit
      parameters:
        - name: unitId
          in: path
