  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Lowercase RFC 9562 UUIDv7 used for request, response, audit, and event correlation.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    WorkRecordCursor:
      name: cursor
      in: query
      description: Opaque continuation token bound to the originating limit and classification query plus the effective principal and facility scope; malformed or mismatched reuse receives the same metadata-safe 400 response.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Classification:
      name: classification
      in: query
      schema:
        $ref: '#/components/schemas/Classification'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
  headers:
    ETag:
      description: Strong entity version tag
      required: true
      schema:
        type: string
    Correlation:
      description: Required request correlation value echoed by the service; lowercase RFC 9562 UUIDv7.
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
  responses:
    WorkRecord:
      description: Authorized work record envelope
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkRecordResponse'
    BadRequest:
      description: Invalid request (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Unauthorized:
      description: Authentication required or invalid (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Forbidden:
      description: Authorization denied (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    NotFound:
      description: Resource not found or intentionally concealed (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Conflict:
      description: State or idempotency conflict (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    PreconditionFailed:
      description: If-Match does not match the current version (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem-details.schema'
    Collection:
      description: Cursor-paginated authorized collection
      headers:
        Link:
          schema:
            type: string
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityCollection'
    Entity:
      description: Authorized typed resource representation
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Entity'
    AccessDecision:
      description: Explainable access decision
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
