openapi: 3.1.0
info:
  title: Cluster Platform R1 Screens API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://cluster.example/legal
  description: Executable contract for the complete R1 user-facing screen surface.
servers:
  - url: https://api.cluster.example/api/v1
security:
  - bearerAuth: []
paths:
  /work-records/{recordId}/return: {$ref: "./openapi.yaml#/paths/~1work-records~1{recordId}~1return"}
  /work-records/{recordId}/complete: {$ref: "./openapi.yaml#/paths/~1work-records~1{recordId}~1complete"}
  /work-records/{recordId}/complete-submission: {$ref: "./openapi.yaml#/paths/~1work-records~1{recordId}~1complete-submission"}
  /authorization/{adminResource}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Authorization Admin
      summary: List authorization administration resources
      operationId: listAuthorizationAdminResources
      parameters:
        - name: adminResource
          in: path
          required: true
          schema:
            type: string
            enum:
              - roles
              - capabilities
              - role-assignments
              - delegations
              - classification-policies
              - field-access-templates
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Authorization Admin
      summary: Create an authorization administration resource
      operationId: createAuthorizationAdminResource
      parameters:
        - name: adminResource
          in: path
          required: true
          schema:
            type: string
            enum:
              - roles
              - capabilities
              - role-assignments
              - delegations
              - classification-policies
              - field-access-templates
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationAdminCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /authorization/{adminResource}/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Authorization Admin
      summary: Get an authorization administration resource
      operationId: getAuthorizationAdminResource
      parameters:
        - name: adminResource
          in: path
          required: true
          schema:
            type: string
            enum:
              - roles
              - capabilities
              - role-assignments
              - delegations
              - classification-policies
              - field-access-templates
        - name: resourceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Authorization Admin
      summary: Update a mutable authorization administration resource
      operationId: updateAuthorizationAdminResource
      parameters:
        - name: adminResource
          in: path
          required: true
          schema:
            type: string
            enum:
              - roles
              - capabilities
              - role-assignments
              - delegations
              - classification-policies
              - field-access-templates
        - name: resourceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AuthorizationAdminPatch'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /authorization/{adminResource}/{resourceId}/{authorizationAction}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Authorization Admin
      summary: Activate, revoke, expire, or publish an authorization resource
      operationId: transitionAuthorizationAdminResource
      parameters:
        - name: adminResource
          in: path
          required: true
          schema:
            type: string
            enum:
              - role-assignments
              - delegations
              - classification-policies
              - field-access-templates
        - name: resourceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
        - name: authorizationAction
          in: path
          required: true
          schema:
            type: string
            enum:
              - activate
              - revoke
              - expire
              - publish
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /authorization/access-decisions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Evaluate access from actor context and current AuthorizationRecordFacts
      operationId: decideAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AccessDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /authorization/access-decisions/{decisionId}/explanation:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Explain a recorded access decision
      operationId: explainAccessDecision
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/AccessDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organization/supervisory-relationships:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Organization Admin
      summary: List supervisory relationships
      operationId: listSupervisoryRelationships
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Organization Admin
      summary: Create a supervisory relationship with explicit capabilities
      operationId: createSupervisoryRelationship
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisoryRelationshipCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /work-definitions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List work definitions
      operationId: listWorkDefinitions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a work definition
      operationId: createWorkDefinition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /work-definitions/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Get a work definition
      operationId: getWorkDefinition
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a work definition
      operationId: updateWorkDefinition
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionPatch'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definitions/{definitionId}/versions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List immutable work definition versions
      operationId: listWorkDefinitionVersions
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a Draft work definition version
      operationId: createWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionVersionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /work-definition-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Get a work definition version
      operationId: getWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a Draft work definition version; Signed and Published versions are immutable
      operationId: updateWorkDefinitionVersionDraft
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionVersionPatch'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/test:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      summary: Test a Draft version and transition it to Tested
      operationId: testWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/approve:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      summary: Approve a Tested version
      operationId: approveWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/sign:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      summary: Sign an Approved version whose schema hash matches
      operationId: signWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequest'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      summary: Publish a Signed version as immutable
      operationId: publishWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /workflow/definitions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List workflow definitions
      operationId: listWorkflowDefinitions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a workflow definition and its first Draft version
      operationId: createWorkflowDefinition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinitionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /workflow/definitions/{definitionId}/versions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List workflow versions
      operationId: listWorkflowVersions
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a Draft workflow version
      operationId: createWorkflowVersion
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowVersionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workflow/versions/{versionId}/{workflowLifecycleAction}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Test, approve, sign, or publish a workflow version in lifecycle order
      operationId: transitionWorkflowVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - name: workflowLifecycleAction
          in: path
          required: true
          schema:
            type: string
            enum:
              - test
              - approve
              - sign
              - publish
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleAction'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /workflow/instances:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List authorized workflow instances
      operationId: listWorkflowInstances
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema:
            type: string
            enum:
              - running
              - completed
              - cancelled
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Start a workflow using a Published version
      operationId: startWorkflow
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStart'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workflow/instances/{instanceId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Requests
        - Workflow
      summary: Get workflow instance state, current owner, age, and step history for request tracking,
      operationId: getWorkflowInstance,
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowInstanceTrackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List assigned tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a standalone or source-linked task
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/from-step/{stepId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      operationId: createTaskFromStep
      summary: Create the user task for an active workflow step
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUIDv7'
