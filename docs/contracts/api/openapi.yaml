          type: integer
          const: 409
        detail:
          type: string
        correlation_id:
          type: string
    problem-details.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://contracts.cluster.example/schemas/problem-details.schema.json
      title: Problem Details
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlation_id:
          $ref: '#/components/schemas/uuidv7'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - pointer
              - code
            properties:
              pointer:
                type: string
              code:
                type: string
              message:
                type: string
      $defs:
        uuidv7:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Lowercase RFC 9562 UUID version 7
    principal-context.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://contracts.cluster.example/schemas/principal-context.schema.json
      title: Principal Context
      description: 'The server-owned projection of the current principal returned by GET /me. It is the Access Context plus the capability codes the principal currently holds, which the shell uses to decide which navigation entries to render. The list is a navigation hint only: every endpoint still runs its own record-scoped decision.'
      type: object
      additionalProperties: false
      required:
        - subject_id
        - tenant_id
        - clearance
        - correlation_id
        - features
      properties:
        subject_id:
          $ref: '#/components/schemas/uuidv7'
        tenant_id:
          $ref: '#/components/schemas/uuidv7'
        organization_unit_ids:
          type: array
          items:
            $ref: '#/components/schemas/uuidv7'
          uniqueItems: true
        roles:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        capabilities:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*(\.[a-z0-9_-]+)+$
          uniqueItems: true
          description: Capability codes granted to the principal by an active role assignment or delegation, sorted ascending.
        clearance:
          type: string
          enum:
            - public
            - internal
            - confidential
            - top_secret
        break_glass:
          type: boolean
          default: false
        features:
          type: object
          additionalProperties: false
          required:
            - work_management
            - tasks
          properties:
            work_management:
              type: boolean
              description: Whether the work-management feature is enabled for the principal's tenant.
            tasks:
