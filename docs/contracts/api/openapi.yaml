openapi: 3.1.0
info:
  title: Cluster Platform API
  version: 1.1.0
  license: { name: Proprietary, url: "https://cluster.example/legal" }
  description: Authenticated, authorization-filtered API. IDs are lowercase RFC 9562 UUIDv7 values and timestamps are RFC 3339 UTC values ending in Z.
servers:
  - url: https://api.cluster.example/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Authenticate a principal
      security: []
      operationId: login
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Login" } },
            },
        }
      responses:
        {
          "200":
            {
              description: Authenticated session,
              headers:
                {
                  X-Correlation-ID:
                    { $ref: "#/components/headers/Correlation" },
                },
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/SessionResponse" } },
                },
            },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
  /auth/logout:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Revoke the current session
      operationId: logout
      responses:
        {
          "204":
            {
              description: Session revoked,
              headers:
                {
                  X-Correlation-ID:
                    { $ref: "#/components/headers/Correlation" },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /me:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: Get the current principal
      operationId: getCurrentPrincipal
      responses:
        {
          "200": { $ref: "#/components/responses/Principal" },
          "401": { $ref: "#/components/responses/Problem" },
        }
  /me/scopes:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      tags: [Identity]
      summary: List scopes already allowed for the current principal
      operationId: listMyScopes
      responses:
        "200":
          description: Allowed and currently effective scopes
          headers: { X-Correlation-ID: { $ref: "#/components/headers/Correlation" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeSelection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/scope:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    put:
      tags: [Identity]
      summary: Select one previously allowed effective scope without expanding access
      operationId: selectMyScope
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeSelectionUpdate" }
      responses:
        "200":
          description: Effective scope selected
          headers:
            X-Correlation-ID: { $ref: "#/components/headers/Correlation" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeSelection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /work-definitions:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: List work definitions
      operationId: listWorkDefinitions
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Collection" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
    post:
      summary: Create a work definition
      operationId: createWorkDefinition
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/WorkDefinitionCreate" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /work-definitions/{definitionId}:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: Get a work definition
      operationId: getWorkDefinition
      parameters: [{ $ref: "#/components/parameters/DefinitionId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    patch:
      summary: Update a work definition
      operationId: updateWorkDefinition
      parameters:
        [
          { $ref: "#/components/parameters/DefinitionId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/merge-patch+json:
                {
                  schema: { $ref: "#/components/schemas/WorkDefinitionPatch" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-definitions/{definitionId}/versions:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: List immutable work definition versions
      operationId: listWorkDefinitionVersions
      parameters:
        [
          { $ref: "#/components/parameters/DefinitionId" },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Collection" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    post:
      summary: Create a Draft work definition version
      operationId: createWorkDefinitionVersion
      parameters:
        [
          { $ref: "#/components/parameters/DefinitionId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/WorkDefinitionVersionCreate",
                    },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /work-definition-versions/{versionId}:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: Get a work definition version
      operationId: getWorkDefinitionVersion
      parameters: [{ $ref: "#/components/parameters/VersionId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    patch:
      summary: Update a Draft work definition version; Signed and Published versions are immutable
      operationId: updateWorkDefinitionVersionDraft
      parameters:
        [
          { $ref: "#/components/parameters/VersionId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/merge-patch+json:
                {
                  schema:
                    { $ref: "#/components/schemas/WorkDefinitionVersionPatch" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-definition-versions/{versionId}/test:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      {
        summary: Test a Draft version and transition it to Tested,
        operationId: testWorkDefinitionVersion,
        parameters:
          [
            { $ref: "#/components/parameters/VersionId" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/IdempotencyKey" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Entity" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
            "412": { $ref: "#/components/responses/PreconditionFailed" },
          },
      }
  /work-definition-versions/{versionId}/approve:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      {
        summary: Approve a Tested version,
        operationId: approveWorkDefinitionVersion,
        parameters:
          [
            { $ref: "#/components/parameters/VersionId" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/IdempotencyKey" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Entity" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
            "412": { $ref: "#/components/responses/PreconditionFailed" },
          },
      }
  /work-definition-versions/{versionId}/sign:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Sign an Approved version whose schema hash matches
      operationId: signWorkDefinitionVersion
      parameters:
        [
          { $ref: "#/components/parameters/VersionId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SignatureRequest" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-definition-versions/{versionId}/publish:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      {
        summary: Publish a Signed version as immutable,
        operationId: publishWorkDefinitionVersion,
        parameters:
          [
            { $ref: "#/components/parameters/VersionId" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/IdempotencyKey" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Entity" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
            "412": { $ref: "#/components/responses/PreconditionFailed" },
          },
      }
  /work-records:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: List authorized work records using opaque cursor pagination
      operationId: listWorkRecords
      parameters:
        [
          { $ref: "#/components/parameters/WorkRecordCursor" },
          { $ref: "#/components/parameters/Limit" },
          { $ref: "#/components/parameters/Classification" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecordCollection" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
    post:
      summary: Create a work record
      operationId: createWorkRecord
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/WorkRecordCreate" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "422": { $ref: "#/components/responses/UnprocessableEntity" },
          "500": { $ref: "#/components/responses/InternalServerError" },
        }
  /notifications:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: List notifications for the authenticated principal
      operationId: listMyNotifications
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Notifications" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/NotificationUnauthorized" },
        }
  /work-records/{recordId}:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      summary: Get a work record
      operationId: getWorkRecord
      parameters: [{ $ref: "#/components/parameters/RecordId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    patch:
      summary: Update a work record
      operationId: updateWorkRecord
      parameters:
        [
          { $ref: "#/components/parameters/RecordId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                payload: { type: object }
                responsible_user_id: { type: string, format: uuid }
                classification: { $ref: "#/components/schemas/Classification" }
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-records/{recordId}/cancel:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Cancel a work record without physical deletion
      operationId: cancelWorkRecord
      parameters:
        [
          { $ref: "#/components/parameters/RecordId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReasonAction" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-records/{recordId}/archive:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Archive a terminal work record subject to retention and holds
      operationId: archiveWorkRecord
      parameters:
        [
          { $ref: "#/components/parameters/RecordId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReasonAction" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /work-records/{recordId}/submit:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Submit a work record
      operationId: submitWorkRecord
      parameters:
        [
          { $ref: "#/components/parameters/RecordId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: false,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      properties:
                        { comment: { type: string, maxLength: 1000 } },
                    },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/WorkRecord" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /workflow/definitions:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      {
        summary: List workflow definitions,
        operationId: listWorkflowDefinitions,
        parameters:
          [
            { $ref: "#/components/parameters/Cursor" },
            { $ref: "#/components/parameters/Limit" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Collection" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
          },
      }
    post:
      summary: Create a workflow definition and its first Draft version
      operationId: createWorkflowDefinition
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/WorkflowDefinitionCreate" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /workflow/definitions/{definitionId}/versions:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      {
        summary: List workflow versions,
        operationId: listWorkflowVersions,
        parameters:
          [
            { $ref: "#/components/parameters/DefinitionId" },
            { $ref: "#/components/parameters/Cursor" },
            { $ref: "#/components/parameters/Limit" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Collection" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    post:
      summary: Create a Draft workflow version
      operationId: createWorkflowVersion
      parameters:
        [
          { $ref: "#/components/parameters/DefinitionId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/WorkflowVersionCreate" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /workflow/versions/{versionId}:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    get:
      {
        summary: Get a workflow version graph,
        operationId: getWorkflowVersion,
        parameters: [{ $ref: "#/components/parameters/VersionId" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Entity" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      summary: Update a Draft workflow graph
      operationId: updateWorkflowVersionDraft
      parameters:
        [
          { $ref: "#/components/parameters/VersionId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/merge-patch+json:
                {
                  schema: { $ref: "#/components/schemas/WorkflowVersionPatch" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Entity" },
          "400": { $ref: "#/components/responses/BadRequest" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /workflow/versions/{versionId}/{workflowLifecycleAction}:
    parameters: [{ $ref: "#/components/parameters/CorrelationId" }]
    post:
      summary: Test, approve, sign, or publish a workflow version in lifecycle order
      operationId: transitionWorkflowVersion
      parameters:
        [
          { $ref: "#/components/parameters/VersionId" },
          {
            name: workflowLifecycleAction,
            in: path,
            required: true,
