                    const: The audit chain reported a violation.
    AuditRuntimeUnavailable:
      description: Audit integrity verification runtime is temporarily unavailable (RFC 7807)
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/problem-details.schema'
              - type: object
                required:
                  - type
