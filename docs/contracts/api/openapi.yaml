components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    identitySession:
      type: apiKey
      in: cookie
      name: cluster_identity_session
      description: HttpOnly, Secure identity-session cookie issued by `POST /identity/login`.
    documentsWorkerToken:
      type: apiKey
      in: header
      name: X-Documents-Worker-Token
      description: Internal document worker credential. It is never issued by this API.
  headers:
    Correlation:
      description: Required request correlation value echoed by the service; lowercase RFC 9562 UUIDv7.
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ETag:
      description: Strong entity version tag
      required: true
      schema:
        type: string
    CacheETag:
      description: Weak representation validator used with If-None-Match.
      required: true
      schema:
        type: string
        pattern: ^W/"[A-Za-z0-9._:-]+"$
    ResourceVersion:
      description: Strong lock version used as the If-Match value for temporary assignment changes.
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    CsrfToken:
      description: CSRF proof issued with the identity session.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Lowercase RFC 9562 UUIDv7 used for request, response, audit, and event correlation.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
    WorkRecordCursor:
      name: cursor
      in: query
      description: Opaque continuation token bound to the originating limit and classification query plus the effective principal and facility scope; malformed or mismatched reuse receives the same metadata-safe 400 response.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Classification:
      name: classification
      in: query
      schema:
        $ref: '#/components/schemas/Classification'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
        maxLength: 4096
    TemporaryAssignmentIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current X-Resource-Version value, not the weak ETag representation validator.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    OrganizationUnitIdQuery:
      name: organization_unit_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    TemporaryAssignmentId:
      name: temporaryAssignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUIDv7'
    AuditSourceModule:
      name: source_module
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z][a-z0-9_-]*$'
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)*$'
    AuditActorId:
      name: actor_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUIDv7'
    AuditSubjectType:
      name: subject_type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z][a-z0-9_-]*$'
    AuditSubjectId:
      name: subject_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUIDv7'
      description: |
        Requires `subject_type`. Sending `subject_id` without `subject_type` returns 400 `invalid-filter`.
    AuditCorrelationIdQuery:
      name: correlation_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UUIDv7'
    AuditClassification:
      name: classification
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Classification'
    AuditOccurredFrom:
      name: occurred_from
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UtcDateTime'
      description: Inclusive lower bound on `occurred_at`; must be ≤ `occurred_to` when both are set.
    AuditOccurredTo:
      name: occurred_to
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UtcDateTime'
  responses:
    ClusterEntity:
      description: Singleton cluster representation
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Correlation-ID:
          $ref: '#/components/headers/Correlation'
