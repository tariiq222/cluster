  schemas:
    OperationsOfficeSubmission:
      type: object
      additionalProperties: false
      required:
        - workflow_version_id
      properties:
        workflow_version_id:
          $ref: '#/components/schemas/UUIDv7'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    OperationsOfficeReturn:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 2000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    OperationsOfficeApproval:
      type: object
      additionalProperties: false
      properties:
        graph_hash_observed:
          type: string
          minLength: 32
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    OperationsOfficePublication:
      type: object
      additionalProperties: false
      required:
        - scope
        - usage_description
      properties:
        scope:
          $ref: '#/components/schemas/AudienceScope'
        usage_description:
          type: string
          maxLength: 1000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    OperationsOfficePublicationResult:
      type: object
      additionalProperties: false
      required:
        - version
        - self_approval_override
        - audience_summary
      properties:
        version:
          $ref: '#/components/schemas/OperationsOfficeVersion'
        self_approval_override:
          type: boolean
        audience_summary:
          type: object
          additionalProperties: false
          required:
            - matched_users
            - audience_keys
          properties:
            matched_users:
              type: integer
            audience_keys:
              type: array
              items:
                type: string
    OperationsOfficeVersion:
      allOf:
        - $ref: '#/components/schemas/DomainResource'
        - type: object
          required:
            - workflow_definition_id
            - version_number
            - lifecycle_state
            - author_user_id
            - current_owner_user_id
            - single_member_bootstrap_approval
            - last_transition_at
            - published_at
          properties:
            workflow_definition_id:
              $ref: '#/components/schemas/UUIDv7'
            version_number:
              type: integer
            lifecycle_state:
              type: string
              enum:
                - draft
                - pending_review
                - published
                - returned
            author_user_id:
              oneOf:
                - $ref: '#/components/schemas/UUIDv7'
                - type: 'null'
            current_owner_user_id:
              oneOf:
                - $ref: '#/components/schemas/UUIDv7'
                - type: 'null'
            single_member_bootstrap_approval:
              type: boolean
            last_transition_at:
              oneOf:
                - $ref: '#/components/schemas/UtcDateTime'
                - type: 'null'
            published_at:
              oneOf:
                - $ref: '#/components/schemas/UtcDateTime'
                - type: 'null'
    WorkflowInstanceTracking:
      allOf:
        - $ref: '#/components/schemas/DomainResource'
        - type: object
          required:
            - workflow_version_id
            - source_module
            - source_type
            - source_id
            - state
            - current_owner_user_id
            - age_seconds
            - step_history
          properties:
            workflow_version_id:
              $ref: '#/components/schemas/UUIDv7'
            source_module:
              type: string
            source_type:
              type: string
            source_id:
              type: string
            state:
              type: string
            current_owner_user_id:
              oneOf:
                - $ref: '#/components/schemas/UUIDv7'
                - type: 'null'
            age_seconds:
              type: integer
            step_history:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowStepHistoryEntry'
    WorkflowStepHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - step_id
        - node_key
        - node_type
        - state
        - assignee_user_id
        - activated_at
        - completed_at
        - actor_user_id
        - decision
        - reason
      properties:
        step_id:
          $ref: '#/components/schemas/UUIDv7'
        workflow_instance_id:
          $ref: '#/components/schemas/UUIDv7'
        lock_version:
          type: integer
          minimum: 1
        node_key:
          type: string
        node_type:
          type: string
        state:
          type: string
        assignee_user_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        activated_at:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        actor_user_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        decision:
          type:
            - string
            - 'null'
        reason:
          type:
            - string
            - 'null'
    AudienceScope:
      type: object
      additionalProperties: false
      required:
        - audience_type
        - audience_reference
      properties:
        audience_type:
          type: string
          enum:
            - all
            - facility
            - roles
        audience_reference:
          type: array
          items:
            $ref: '#/components/schemas/UUIDv7'
    OperationsOfficeAuditEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - version_id
        - actor_user_id
        - decision
        - reason
        - correlation_id
        - recorded_at
        - single_member_bootstrap_approval
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        version_id:
          $ref: '#/components/schemas/UUIDv7'
        actor_user_id:
          $ref: '#/components/schemas/UUIDv7'
        decision:
          type: string
        reason:
          type:
            - string
            - 'null'
        correlation_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        recorded_at:
          $ref: '#/components/schemas/UtcDateTime'
        single_member_bootstrap_approval:
          type: boolean
    OperationsOfficeAuditCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationsOfficeAuditEntry'
        next_cursor:
          type:
            - string
            - 'null'
    AuditActorType:
      type: string
      enum:
        - user
        - service
        - system
    AuditOutcome:
      type: string
      enum:
        - succeeded
        - denied
        - failed
    AuditIntegrityStatus:
      type: string
      enum:
        - verified
        - violated
        - unverified
    AuditExportFormat:
      type: string
      enum:
        - csv
        - ndjson
    AuditExportStatus:
      type: string
      enum:
        - ready
        - expired
    AuditEventContext:
      description: |
        Server-redacted, depth-bounded JSON object. Bytes, raw secrets,
        integrity key material, request hashes, and HMAC inputs never appear here.
      type: object
      additionalProperties:
        type:
          - string
          - integer
          - boolean
          - 'null'
          - array
          - object
    AuditEvent:
      description: |
        Redacted, projected audit event. Never exposes `event_hash`, `previous_hash`,
        `request_hash`, or `integrity_key_version`.
      type: object
      additionalProperties: false
      required:
        - event_id
        - source_module
        - action
        - event_type
        - actor_type
        - actor_id
        - original_actor_id
        - subject_type
        - subject_id
        - correlation_id
        - outcome
        - classification
        - context
        - occurred_at
        - recorded_at
        - access_decision_id
        - retention_until
        - integrity_status
        - allowed_actions
      properties:
        event_id:
          $ref: '#/components/schemas/UUIDv7'
        source_module:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]*$'
        action:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)*$'
        event_type:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^com\.cluster\.[a-z][a-z0-9_-]*\.[a-z][a-z0-9]*\.v[1-9][0-9]*$'
        actor_type:
          $ref: '#/components/schemas/AuditActorType'
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        original_actor_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        subject_type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]*$'
        subject_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        correlation_id:
          $ref: '#/components/schemas/UUIDv7'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        classification:
          $ref: '#/components/schemas/Classification'
        context:
          $ref: '#/components/schemas/AuditEventContext'
        occurred_at:
          $ref: '#/components/schemas/UtcDateTime'
        recorded_at:
          $ref: '#/components/schemas/UtcDateTime'
        access_decision_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        retention_until:
          $ref: '#/components/schemas/UtcDateTime'
        integrity_status:
          $ref: '#/components/schemas/AuditIntegrityStatus'
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^[a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)*$'
    AuditEventCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 4096
            - type: 'null'
    AuditExportFilters:
      description: |
        Snapshot-bound filters captured at creation. Unknown keys are rejected
        with `invalid-export-payload`. Allowed keys: `source_module`, `action`,
        `correlation_id`, plus `occurred_from` / `occurred_to` bounds.
      type: object
      additionalProperties: false
      properties:
        source_module:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: '^[a-z][a-z0-9_-]*$'
            - type: 'null'
        action:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: '^[a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)*$'
            - type: 'null'
        correlation_id:
          oneOf:
            - $ref: '#/components/schemas/UUIDv7'
            - type: 'null'
        occurred_from:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
        occurred_to:
          oneOf:
            - $ref: '#/components/schemas/UtcDateTime'
            - type: 'null'
    AuditExportCreate:
      type: object
      additionalProperties: false
      required:
        - format
        - reason
      properties:
        format:
          $ref: '#/components/schemas/AuditExportFormat'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        filters:
          $ref: '#/components/schemas/AuditExportFilters'
    AuditExportDescriptor:
      description: |
        Frozen audit export descriptor. No raw context, no idempotency key,
        no request hash, no artifact path or hash ever appears on this DTO.
      type: object
      additionalProperties: false
      required:
        - id
        - principal_id
