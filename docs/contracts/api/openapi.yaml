      tags:
        - Audit
      summary: Create a ready-only audit export descriptor for the current scope
      operationId: createAuditExport
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportCreate'
      responses:
        '201':
          description: |
            Stored descriptor returned on a fresh creation or on an equal
            idempotent replay (replay path: stored descriptor, ETag, and
            one immutable Audit creation activity — never a second
            `AuditExportCompletedV1` outbox event).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportDescriptor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AuditIdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Audit
      summary: Get a single audit export descriptor
      operationId: getAuditExport
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: |
            Stored descriptor with frozen snapshot bound and a strong
            ETag. The ETag embeds the export id and the current
            `lock_version`, so the unique mutating transition
            (`ready` → `expired`, which advances `lock_version`)
            produces a fresh ETag. Repeated reads of an unchanged
            descriptor return the same ETag; the first observation
            after the descriptor's `expires_at` is past moves the
            descriptor to `expired` and bumps the ETag.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportDescriptor'
        '404':
          $ref: '#/components/responses/AuditExportNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Audit
      summary: Stream the frozen audit export as UTF-8 CSV or NDJSON
      operationId: downloadAuditExport
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: |
            Streamed, frozen snapshot of audit events covered by the
            descriptor. The stream is chunked by the server with a
            fixed, plan-safe maximum number of rows; rows are scanned
            in `(recorded_at DESC, id DESC)` order and a single
            chunked `audit_events` cursor. Capability is evaluated
            before expiry is disclosed so an unauthorized caller
            cannot distinguish a missing descriptor from a forbidden
            one — both are concealed as a 404 problem.
          headers:
            Content-Type:
              required: true
              schema:
                type: string
                enum:
                  - text/csv; charset=utf-8
                  - application/x-ndjson; charset=utf-8
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: ^attachment; filename="audit-export-[0-9a-f-]{36}\.(csv|ndjson)"$
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store, no-cache, must-revalidate, max-age=0
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
            Expires:
              required: true
              schema:
                type: string
                enum:
                  - '0'
            X-Audit-Export-Id:
              required: true
              schema:
                $ref: '#/components/schemas/UUIDv7'
            X-Audit-Export-Expires-At:
              required: true
              schema:
                $ref: '#/components/schemas/UtcDateTime'
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
          content:
            text/csv; charset=utf-8:
              schema:
                type: string
                description: |
                  RFC 4180 UTF-8 CSV. The first line is the header in the exact order
                  `event_id,occurred_at,recorded_at,source_module,action,event_type,actor_type,actor_id,subject_type,subject_id,correlation_id,outcome,classification,retention_until,context`.
                  Cells whose first byte is `=`, `+`, `-`, `@`, tab (`\t`), or carriage return (`\r`) are prefixed with a single quote so a spreadsheet cannot reinterpret them as a formula. Any cell containing `,`, `"`, `\n`, `\r`, or `\t` is double-quoted and inner `"` are escaped as `""`.
                  Context is a JSON object serialized in one cell.
            application/x-ndjson; charset=utf-8:
              schema:
                type: string
                description: |
                  Newline-delimited JSON. Each line is one projected Audit row with the same columns
                  documented for the CSV header.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AuditExportNotFound'
        '410':
          $ref: '#/components/responses/AuditExportExpired'
        '500':
          $ref: '#/components/responses/InternalServerError'
