    AuditIntegrityRequest:
      description: |
        Verification request payload. `stream_key` is required. The bounded
        `first_sequence` / `last_sequence` pair must be supplied together
        (both present or both absent) and may not exceed 5000 events.
      type: object
      additionalProperties: false
      required:
        - stream_key
      properties:
        stream_key:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*:(?:[0-9a-f-]{36}|global)$'
        first_sequence:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        last_sequence:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
    AuditIntegrityResult:
      description: |
        Sanitized verification result. Never exposes `event_hash`,
        `previous_hash`, `integrity_key_version`, request hash, HMAC key
        material, or canonical JSON.
      type: object
      additionalProperties: false
      required:
        - stream_key
        - first_sequence
        - last_sequence
        - verified_event_count
        - integrity_status
        - checkpoint_id
      properties:
        stream_key:
          type: string
          minLength: 1
          maxLength: 160
        first_sequence:
          type: integer
          minimum: 1
        last_sequence:
          type: integer
          minimum: 1
        verified_event_count:
          type: integer
          minimum: 0
        integrity_status:
          $ref: '#/components/schemas/AuditIntegrityStatus'
        checkpoint_id:
          $ref: '#/components/schemas/UUIDv7'
