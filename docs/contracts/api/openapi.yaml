openapi: 3.1.0
info:
  title: Cluster Platform API
  version: 1.1.0
  license:
    name: Proprietary
    url: https://cluster.example/legal
  description: Authenticated, authorization-filtered API. IDs are lowercase RFC 9562 UUIDv7 values and timestamps are RFC 3339 UTC values ending in Z.
servers:
  - url: https://api.cluster.example/api/v1
x-feature-gates:
  work-management:
    description: "Work Definitions, Work Records, request journeys, approvals, and Workflow execution. Operations tagged x-feature-gate: work-management return 409 feature-disabled on mutation and non-disclosing 404 on read while disabled; reads remain available to principals holding work_management.history.read."
    default: false
security:
  - bearerAuth: []
paths:
  /auth/login:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      summary: Authenticate a principal
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated session
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: planned
    post:
      summary: Revoke the current session
      operationId: logout
      responses:
        '204':
          description: Session revoked
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /identity/login:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Authenticate and create an identity session
      operationId: identityLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/activation:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Consume an activation token and set an initial credential
      operationId: consumeIdentityActivation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityActivationRequest'
      responses:
        '204':
          $ref: '#/components/responses/CorrelationNoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/me:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Identity
      summary: Get the current identity session and account
      operationId: getCurrentIdentity
      security:
        - identitySession: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/csrf:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Rotate the CSRF proof for the current identity session
      operationId: refreshIdentityCsrf
      security:
        - identitySession: []
      responses:
        '200':
          description: Current session CSRF proof
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - csrf_token
                    properties:
                      csrf_token:
                        type: string
                        minLength: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /identity/logout:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Revoke the current identity session
      operationId: identityLogout
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/IdentitySessionRevoked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /identity/password:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Change the current principal credential and revoke its session
      operationId: changeIdentityPassword
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityPasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/IdentitySessionRevoked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /identity/accounts/{accountId}/activation:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags:
        - Identity
      summary: Issue a controlled activation for an account
      operationId: issueIdentityActivation
      security:
        - identitySession: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/IdentityActivationIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: Get the current principal
      operationId: getCurrentPrincipal
      responses:
        '200':
          $ref: '#/components/responses/Principal'
        '401':
          $ref: '#/components/responses/Problem'
  /me/scopes:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
        - Identity
      summary: List scopes already allowed for the current principal
      operationId: listMyScopes
      responses:
        '200':
          description: Allowed and currently effective scopes
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeSelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/scope:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    put:
      tags:
        - Identity
      summary: Select one previously allowed effective scope without expanding access
      operationId: selectMyScope
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeSelectionUpdate'
      responses:
        '200':
          description: Effective scope selected
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/Correlation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definitions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: List work definitions
      operationId: listWorkDefinitions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      x-feature-gate: work-management
      summary: Create a work definition
      operationId: createWorkDefinition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
  /work-definitions/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: Get a work definition
      operationId: getWorkDefinition
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-feature-gate: work-management
      x-implementation-status: planned  # [planned: not yet wired — method]
      summary: Update a work definition
      operationId: updateWorkDefinition
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionPatch'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definitions/{definitionId}/versions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: List immutable work definition versions
      operationId: listWorkDefinitionVersions
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      x-feature-gate: work-management
      summary: Create a Draft work definition version
      operationId: createWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionVersionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
  /work-definition-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: Get a work definition version
      operationId: getWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-feature-gate: work-management
      x-implementation-status: planned  # [planned: not yet wired — method]
      summary: Update a Draft work definition version; Signed and Published versions are immutable
      operationId: updateWorkDefinitionVersionDraft
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WorkDefinitionVersionPatch'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/test:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Test a Draft version and transition it to Tested
      operationId: testWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/approve:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Approve a Tested version
      operationId: approveWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/sign:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Sign an Approved version whose schema hash matches
      operationId: signWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequest'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-definition-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Publish a Signed version as immutable
      operationId: publishWorkDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-records:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: List authorized work records using opaque cursor pagination
      operationId: listWorkRecords
      parameters:
        - $ref: '#/components/parameters/WorkRecordCursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Classification'
      responses:
        '200':
          $ref: '#/components/responses/WorkRecordCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      x-feature-gate: work-management
      summary: Create a work record
      operationId: createWorkRecord
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRecordCreate'
      responses:
        '201':
          $ref: '#/components/responses/WorkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /notifications:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      summary: List notifications for the authenticated principal
      operationId: listMyNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Notifications'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotificationUnauthorized'
  /work-records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      x-feature-gate: work-management
      summary: Get a work record
      operationId: getWorkRecord
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          $ref: '#/components/responses/WorkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-feature-gate: work-management
      x-implementation-status: planned  # [planned: not yet wired — method]
      summary: Update a work record
      operationId: updateWorkRecord
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                responsible_user_id:
                  type: string
                  format: uuid
                classification:
                  $ref: '#/components/schemas/Classification'
      responses:
        '200':
          $ref: '#/components/responses/WorkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-records/{recordId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Cancel a work record without physical deletion
      operationId: cancelWorkRecord
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      responses:
        '200':
          $ref: '#/components/responses/WorkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operation rejected because the requested feature is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemFeatureDisabled'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /work-records/{recordId}/archive:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    x-implementation-status: implemented
    post:
      x-feature-gate: work-management
      summary: Archive a terminal work record subject to retention and holds
      operationId: archiveWorkRecord
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      responses:
        '200':
          $ref: '#/components/responses/WorkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
