asyncapi: 3.1.0
info:
  title: Cluster Platform Domain Events
  version: 1.5.0
  description: CloudEvents JSON domain events delivered at least once through transactional Outbox, Redis Streams consumer groups, consumer Inbox, and DLQ.
servers:
  production:
    host: events.cluster.example:6379
    protocol: redis
    protocolVersion: '7'
    description: Redis Streams endpoint using TLS, consumer groups, explicit acknowledgement, and pending-entry recovery.
channels:
  work-record-submitted:
    address: platform.work-record.submitted.v1
    messages:
      workRecordSubmitted:
        $ref: '#/components/messages/WorkRecordSubmitted'
  workflow-step-activated:
    address: platform.workflow.step-activated.v1
    messages:
      workflowStepActivated:
        $ref: '#/components/messages/WorkflowStepActivated'
  workflow-decision-recorded:
