      facilityUpdated:
        $ref: '#/components/messages/FacilityUpdated'
  facility-archived:
    address: platform.organization.facility-archived.v1
    messages:
      facilityArchived:
        $ref: '#/components/messages/FacilityArchived'
  organization-unit-created:
    address: platform.organization.organization-unit-created.v1
    messages:
      organizationUnitCreated:
        $ref: '#/components/messages/OrganizationUnitCreated'
  organization-unit-moved:
    address: platform.organization.organization-unit-moved.v1
    messages:
      organizationUnitMoved:
        $ref: '#/components/messages/OrganizationUnitMoved'
  organization-unit-updated:
