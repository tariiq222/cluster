        $ref: '#/components/messages/PositionCreated'
  position-updated:
    address: platform.organization.position-updated.v1
    messages:
      positionUpdated:
        $ref: '#/components/messages/PositionUpdated'
  assignment-started:
    address: platform.organization.assignment-started.v1
    messages:
      assignmentStarted:
        $ref: '#/components/messages/AssignmentStarted'
  assignment-ended:
    address: platform.organization.assignment-ended.v1
    messages:
      assignmentEnded:
        $ref: '#/components/messages/AssignmentEnded'
  person-registered:
    address: platform.organization.person-registered.v1
    messages:
      personRegistered:
        $ref: '#/components/messages/PersonRegistered'
