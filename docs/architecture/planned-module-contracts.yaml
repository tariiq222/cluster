# Cluster Planned-Module Contracts Baseline (M00)
#
# Normative, machine-readable decision manifest. The M00 plan
# (docs/superpowers/plans/2026-07-26-cluster-planned-module-contracts-baseline.md)
# is the authoritative source; sections 7-12 freeze every value copied below.
# Conflicts with other documentation are resolved in favor of the YAML until
# an approved mutation updates both artifacts atomically.
#
# This file is documentation only. It does not create routes, controllers,
# migrations, or generated-client output. M00 freezes the contract surface
# so M01-M07 may implement in parallel without colliding on shared names.
#
# Required top-level keys (per M00 plan §6, §7, §8, §10, §12, §15):
#   version, approved_design, prerequisite_handoffs, modules, event_types,
#   classification, migration_order, integration_queues, approval.
#
# The seven planned-module entries are exactly M01-M07. Existing implemented
# modules (Shared, PlatformSettings, Organization, Identity, Authorization,
# Documents, Tasks, Notifications, Search, Reporting) appear only as
# prerequisite facts, not as module entries.
#
# Module ranks are mirrored from MODULE_RANKS in
# apps/api/tests/Architecture/ModuleBoundariesTest.php. A planned module's
# runtime MODULE-REGISTRY cutover is indivisible: it must add the real module
# directory, all owned reversible migrations, and migration-manifest entries;
# prove its MODULE_RANKS value is unchanged; remove only that module from
# PLANNED_MODULES; and add exactly its actually created frozen tables to
# TABLE_OWNERS. Premature PLANNED_MODULES removal, ghost table owners, or a
# registry-only cutover are forbidden.

version: 1
baseline_date: '2026-07-27'

# ----------------------------------------------------------------------------
# 1. Approved design (source of truth + plan references)
# ----------------------------------------------------------------------------
approved_design:
  approved_source_of_truth: docs/superpowers/specs/2026-07-26-cluster-production-and-modules-program-design.md
  m00_plan: docs/superpowers/plans/2026-07-26-cluster-planned-module-contracts-baseline.md
  child_plans:
    M01: docs/superpowers/plans/2026-07-26-cluster-audit-module.md
    M02: docs/superpowers/plans/2026-07-26-cluster-records-governance-module.md
    M03: docs/superpowers/plans/2026-07-26-cluster-collaboration-module.md
    M04: docs/superpowers/plans/2026-07-26-cluster-strategy-module.md
    M05: docs/superpowers/plans/2026-07-26-cluster-portfolio-projects-module.md
    M06: docs/superpowers/plans/2026-07-26-cluster-risk-module.md
    M07: docs/superpowers/plans/2026-07-26-cluster-workspace-module.md
  architecture_test_surfaces:
    - apps/api/tests/Architecture/ModuleBoundariesTest.php::MODULE_RANKS
    - apps/api/tests/Architecture/ModuleBoundariesTest.php::PLANNED_MODULES
    - apps/api/tests/Architecture/ModuleBoundariesTest.php::TABLE_OWNERS
  shared_event_catalogue: apps/api/Shared/Infrastructure/Outbox/OutboxEventType.php
  schema_directory: docs/contracts/schemas
  schema_version: CloudEvents-1.0+JSON-Schema-Draft-2020-12
  master_openapi: docs/contracts/api/openapi.yaml
  web_client_bundle: apps/web/src/api/generated/cluster.ts
  web_generation_command: 'npm --prefix apps/web run api:generate'

