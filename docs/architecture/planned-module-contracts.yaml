# ----------------------------------------------------------------------------
# 3. Modules (M00 plan §7.1, §7.2, §8.1, §10, §12)
# ----------------------------------------------------------------------------
# Each module entry freezes rank, API/OpenAPI/web prefixes, ordered owned
# tables, capabilities, public Contract signatures, published DTOs, PHI
# decision, idempotency mode, concurrency mode, test-fake allowance, and
# required owning-module integration tokens. The M05/P5 route token is
# `portfolio`, capability token is `portfolio_projects`, and event token is
# `portfolioprojects`; this intentional asymmetry is frozen.
modules:

  # ---- M01 Audit (rank 3) -------------------------------------------------
  - id: M01
    name: Audit
    rank: 3
    api_prefix: /api/v1/audit
    openapi_prefix: /audit
    web_prefix: /audit
    event_token: audit
    owned_tables:
      - audit_events
      - audit_export_jobs
      - audit_integrity_checkpoints
      - audit_idempotency_keys
    capabilities:
      - audit.event.read
      - audit.event.export
      - audit.integrity.verify
    public_contracts:
      - name: RecordAuditEvent
        signature: 'record(AuditEventInput $input): AuditEventReceipt'
      - name: QueryAuditActivity
        signature: 'query(AuditActivityQuery $query): AuditActivityPage'
    public_dtos:
      - AuditEventInput
      - AuditEventReceipt
      - AuditActivityQuery
      - AuditActivityItem
      - AuditActivityPage
    events: # see event_types for full literals
      - AuditEventRecordedV1
      - AuditExportCompletedV1
      - AuditIntegrityViolationDetectedV1
    classification: confidential_phi_linked
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: append_only_unique_event_id
    test_fake_allowed: false
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL
    block_reason_for_other_modules: |
      M01 does not silently take sensitive_access_events. That table remains
      Authorization-owned until a separately approved handoff specifies
      source/target counts, immutable mapping, cutover, rollback, and
      zero-loss proof.

  # ---- M02 RecordsGovernance (rank 4) ------------------------------------
  - id: M02
    name: RecordsGovernance
    rank: 4
    api_prefix: /api/v1/records-governance
    openapi_prefix: /records-governance
    web_prefix: /records-governance
    event_token: recordsgovernance
    owned_tables:
      - records_governance_retention_policy_versions
      - records_governance_retention_policy_rules
      - records_governance_governed_records
      - records_governance_holds
      - records_governance_disposition_reviews
      - records_governance_evidence
      - records_governance_idempotency_keys
    capabilities:
      - records_governance.retention-policy.read
      - records_governance.retention-policy.manage
      - records_governance.retention-policy.publish
      - records_governance.record.read
      - records_governance.record.register
      - records_governance.hold.read
      - records_governance.hold.manage
      - records_governance.disposition.read
      - records_governance.disposition.review
      - records_governance.disposition.confirm
    public_contracts:
      - name: RegisterGovernedRecord
        signature: 'register(GovernedRecordRegistration $registration): GovernedRecordStatus'
      - name: ReadGovernedRecordStatus
        signature: 'get(RecordSourceReference $source): ?GovernedRecordStatus'
      - name: GuardDispositionExecution
        signature: 'evaluate(RecordSourceReference $source): DispositionExecutionDecision'
      - name: QueryRecordsGovernanceSummary
        signature: 'forScope(RecordsGovernanceSummaryQuery $query): RecordsGovernanceSummary'
    public_dtos:
      - GovernedRecordRegistration
      - GovernedRecordStatus
      - RecordSourceReference
      - DispositionExecutionDecision
      - RecordsGovernanceSummaryQuery
      - RecordsGovernanceSummary
    events:
      - RetentionPolicyVersionPublishedV1
      - GovernedRecordStatusChangedV1
      - RecordHoldChangedV1
      - DispositionExecutionRequestedV1
      - DispositionOutcomeConfirmedV1
    classification: confidential_phi_linked
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: optimistic_lock_version_with_cas
    test_fake_allowed: false
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL

  # ---- M03 Collaboration (rank 6) ----------------------------------------
  - id: M03
    name: Collaboration
    rank: 6
    api_prefix: /api/v1/collaboration
    openapi_prefix: /collaboration
    web_prefix: /collaboration
    event_token: collaboration
    owned_tables:
      - collaboration_threads
      - collaboration_thread_memberships
      - collaboration_comments
      - collaboration_mentions
      - collaboration_comment_revisions
      - collaboration_moderation_actions
      - collaboration_idempotency_keys
    capabilities:
      - collaboration.thread.create
      - collaboration.thread.read
      - collaboration.thread.list
      - collaboration.thread.update
      - collaboration.thread.archive
      - collaboration.membership.manage
      - collaboration.comment.create
      - collaboration.comment.edit
      - collaboration.comment.moderate
    public_contracts:
      - name: OpenCollaborationThread
        signature: 'open(CollaborationThreadRegistration $registration): CollaborationThreadReference'
      - name: ListVisibleCollaborationThreads
        signature: 'list(CollaborationThreadQuery $query): CollaborationThreadPage'
    public_dtos:
      - CollaborationThreadRegistration
      - CollaborationThreadReference
      - CollaborationThreadQuery
      - CollaborationThreadSummary
      - CollaborationThreadPage
    events:
      - CommentPublishedV1
      - MentionCreatedV1
      - ThreadVisibilityChangedV1
    classification: confidential_phi_capable_free_text
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: optimistic_lock_version_with_cas
    test_fake_allowed: false
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL
      - DOCUMENTS-LINKED-FACTS
      - COLLABORATION-SHARED-RELAY
      - NOTIFICATIONS-COLLABORATION-CONSUMER
    owning_packets:
      - |
        M03 publishes immutable DOCUMENTS-LINKED-FACTS,
        COLLABORATION-SHARED-RELAY, and NOTIFICATIONS-COLLABORATION-CONSUMER
        packets. Only the Documents, Shared outbox, and Notifications owners
        respectively apply them. M03 never edits Documents provider
        bindings, Shared outbox internals, or Notifications internals.

  # ---- M04 Strategy (rank 8) ---------------------------------------------
  - id: M04
    name: Strategy
    rank: 8
    api_prefix: /api/v1/strategy
    openapi_prefix: /strategy
    web_prefix: /strategy
    event_token: strategy
    owned_tables:
      - strategy_periods
      - strategy_plans
      - strategy_plan_versions
      - strategy_objectives
      - strategy_outcomes
      - strategy_indicators
      - strategy_indicator_periods
      - strategy_target_distributions
      - strategy_measurements
      - strategy_progress_evidence
      - strategy_approvals
      - strategy_idempotency_keys
    capabilities:
      - strategy.plan.read
      - strategy.plan.manage
      - strategy.indicator.read
      - strategy.indicator.manage
      - strategy.measurement.submit
      - strategy.measurement.approve
      - strategy.impact.read
    public_contracts:
      - name: ResolveStrategyReference
        signature: 'resolve(StrategyAccessContext $context, StrategyResourceType $type, string $id): ?StrategyReference'
      - name: GetStrategySnapshot
        signature: 'forOrganizationUnit(StrategyAccessContext $context, string $organizationUnitId, ?string $periodId = null): StrategySnapshot'
    public_dtos:
      - StrategyResourceType
      - StrategyReference
      - StrategyAccessContext
      - StrategySnapshot
    events:
      - StrategyPlanPublishedV1
      - StrategyPlanRetiredV1
      - StrategyProgressEvidenceApprovedV1
    classification: confidential_business_no_phi
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: optimistic_lock_version_with_cas
    test_fake_allowed: false
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL
    canonical_signature_rule: |
      The fixed canonical M04 signature is
      GetStrategySnapshot::forOrganizationUnit(StrategyAccessContext $context,
      string $organizationUnitId, ?string $periodId = null): StrategySnapshot.
      StrategyAccessContext carries the authenticated principal/scope facts
      used by M04's record-level authorization. Omitting it, passing a raw
      principal instead, or reconstructing authorization outside M04 is a
      blocking contract violation.

  # ---- M05 PortfolioProjects (rank 9) ------------------------------------
  - id: M05
    name: PortfolioProjects
    rank: 9
    # Frozen asymmetry: route token `portfolio`, capability token
    # `portfolio_projects`, event token `portfolioprojects`. Not normalized.
    api_prefix: /api/v1/portfolio
    openapi_prefix: /portfolio
    web_prefix: /portfolio
    event_token: portfolioprojects
    owned_tables:
      - portfolio_projects_portfolios
      - portfolio_projects_programs
      - portfolio_projects_projects
      - portfolio_projects_project_templates
      - portfolio_projects_milestones
      - portfolio_projects_health_snapshots
      - portfolio_projects_budget_snapshots
      - portfolio_projects_indicator_links
      - portfolio_projects_idempotency_keys
    capabilities:
      - portfolio_projects.portfolio.read
      - portfolio_projects.portfolio.manage
      - portfolio_projects.project.read
      - portfolio_projects.project.manage
      - portfolio_projects.milestone.approve
      - portfolio_projects.impact.submit
      - portfolio_projects.budget.read
    public_contracts:
      - name: ResolveAuthorizedProjectReference
        signature: 'resolve(ProjectAccessContext $context, string $projectId): ?ProjectReference'
      - name: ListAuthorizedProjectSummaries
        signature: 'list(AuthorizedProjectSummaryQuery $query): AuthorizedProjectSummaryPage'
    public_dtos:
      - ProjectAccessContext
      - ProjectReference
      - AuthorizedProjectSummaryQuery
      - AuthorizedProjectSummary
      - AuthorizedProjectSummaryPage
    events:
      - ProjectLifecycleChangedV1
      - ProjectHealthSnapshotRecordedV1
      - ProjectProgressReportedV1
      - ProjectIndicatorLinkChangedV1
    classification: confidential_business_no_phi
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: optimistic_lock_version_with_cas
    test_fake_allowed: true
    test_fake_rule: |
      M05 may build module-owned cores against deterministic in-memory fakes
      for the frozen lower-rank contracts while its producer integrations are
      blocked. Fakes implement the exact interface and immutable DTOs, expose
      configured allow/deny/not-found/stale/failure outcomes, perform no
      network/database access, live under tests, and are bound only in tests
      (never in production service providers or container verification).
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL

  # ---- M06 Risk (rank 10) ------------------------------------------------
  - id: M06
    name: Risk
    rank: 10
    api_prefix: /api/v1/risk
    openapi_prefix: /risk
    web_prefix: /risk
    event_token: risk
    owned_tables:
      - risk_registers
      - risk_policy_versions
      - risks
      - risk_assessments
      - risk_controls
      - risk_treatments
      - risk_treatment_actions
      - risk_reviews
      - risk_indicators
      - risk_indicator_readings
      - risk_idempotency_keys
    capabilities:
      - risk.risk.read
      - risk.risk.manage
      - risk.assess
      - risk.control.manage
      - risk.treatment.manage
      - risk.accept
      - risk.kri.manage
    public_contracts:
      - name: ResolveRiskReference
        signature: 'resolve(RiskAccessContext $context, string $riskId): ?RiskReference'
      - name: QueryRiskWorkspaceItems
        signature: 'query(RiskWorkspaceQuery $query): RiskWorkspacePage'
    public_dtos:
      - RiskAccessContext
      - RiskReference
      - RiskWorkspaceQuery
      - RiskWorkspaceItem
      - RiskWorkspacePage
    events:
      - RiskChangedV1
      - RiskReviewDueV1
      - RiskTreatmentActionDueV1
    classification: confidential_business_no_phi
    idempotency_mode: server_replay_with_idempotency_key
    concurrency_mode: optimistic_lock_version_with_cas
    test_fake_allowed: true
    test_fake_rule: |
      M06 may build module-owned cores against deterministic in-memory fakes
      for the frozen lower-rank contracts while its producer integrations are
      blocked. Same restrictions as M05.
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL
    no_tasks_public_port: |
      M06 does not add a Tasks public port under Risk ownership. Due review
      and treatment-action work remains Risk-owned and is exposed through
      Risk queries/routes. A future Tasks integration requires a separate
      approved producer-owned contract amendment and token.

  # ---- M07 Workspace (rank 11) -------------------------------------------
  - id: M07
    name: Workspace
    rank: 11
    api_prefix: /api/v1/workspace
    openapi_prefix: /workspace
    web_prefix: /workspace
    event_token: workspace
    owned_tables:
      - workspace_preferences
    capabilities:
      - workspace.read
      - workspace.preferences.update
    public_contracts: []   # M07 has no published cross-module Contract.
    public_dtos: []        # No public cross-module DTO; HTTP view DTOs remain module-internal.
    events: []             # M07 does not publish a domain Event.
    classification: pii_no_phi
    idempotency_mode: none_atomic_if_match_preference_write
    concurrency_mode: optimistic_lock_version_with_if_match
    test_fake_allowed: true
    test_fake_rule: |
      M07 may use deterministic fakes for exactly the six lower-rank query
      Contracts (M01 QueryAuditActivity, M02 QueryRecordsGovernanceSummary,
      M03 ListVisibleCollaborationThreads, M04 GetStrategySnapshot, M05
      ListAuthorizedProjectSummaries, M06 QueryRiskWorkspaceItems) while
      final aggregation is blocked. Same binding/lifecycle restrictions as
      M05/M06.
    required_integration_tokens:
      - MODULE-REGISTRY
      - API-ROUTES
      - OPENAPI
      - ORVAL
      - WEB-SHELL
    preference_exception: |
      Workspace preferences are write-only via PUT /api/v1/workspace/preferences
      and perform a full replacement guarded by If-Match. Workspace is not
      an event-producing module: the mutation publishes no domain Event and
      appends no outbox row. M07 retry is at-most-once without server-side
      replay state. The If-Match predicate enforces optimistic concurrency
      and the request does not carry Idempotency-Key. A successful write
      always increments lock_version and writes one M01 audit record; the
      command is not retry-safe and there is no equal-representation no-op.
      A retry whose If-Match does not match the current version returns 412
      and writes nothing (no audit record either). Preference, version, and
      M01 audit commit atomically.
    consumer_mapping:
      - consumer: M07
        producer_contract: M01::QueryAuditActivity
        invocation: 'query(AuditActivityQuery $query): AuditActivityPage'
      - consumer: M07
        producer_contract: M02::QueryRecordsGovernanceSummary
        invocation: 'forScope(RecordsGovernanceSummaryQuery $query): RecordsGovernanceSummary'
      - consumer: M07
        producer_contract: M03::ListVisibleCollaborationThreads
        invocation: 'list(CollaborationThreadQuery $query): CollaborationThreadPage'
      - consumer: M07
        producer_contract: M04::GetStrategySnapshot
        invocation: 'forOrganizationUnit(StrategyAccessContext $context, string $organizationUnitId, ?string $periodId = null): StrategySnapshot'
      - consumer: M07
        producer_contract: M05::ListAuthorizedProjectSummaries
        invocation: 'list(AuthorizedProjectSummaryQuery $query): AuthorizedProjectSummaryPage'
      - consumer: M07
        producer_contract: M06::QueryRiskWorkspaceItems
        invocation: 'query(RiskWorkspaceQuery $query): RiskWorkspacePage'

# ----------------------------------------------------------------------------
# 4. Event types (M00 plan §7.3)
# ----------------------------------------------------------------------------
# Format: com.cluster.<module-token>.<concatenated-event-name>.v1
# Module tokens: audit, recordsgovernance, collaboration, strategy,
# portfolioprojects, risk, workspace. Historical underscore/hyphen variants
# are not copied. M07 has no event.
event_types:
  - owner: M01
    class: AuditEventRecordedV1
    type: com.cluster.audit.auditeventrecorded.v1
    schema: docs/contracts/schemas/com-cluster-audit-auditeventrecorded-v1.schema.json
  - owner: M01
    class: AuditExportCompletedV1
    type: com.cluster.audit.auditexportcompleted.v1
    schema: docs/contracts/schemas/com-cluster-audit-auditexportcompleted-v1.schema.json
  - owner: M01
    class: AuditIntegrityViolationDetectedV1
    type: com.cluster.audit.auditintegrityviolationdetected.v1
    schema: docs/contracts/schemas/com-cluster-audit-auditintegrityviolationdetected-v1.schema.json
  - owner: M02
    class: RetentionPolicyVersionPublishedV1
    type: com.cluster.recordsgovernance.retentionpolicyversionpublished.v1
    schema: docs/contracts/schemas/com-cluster-recordsgovernance-retentionpolicyversionpublished-v1.schema.json
  - owner: M02
    class: GovernedRecordStatusChangedV1
    type: com.cluster.recordsgovernance.governedrecordstatuschanged.v1
    schema: docs/contracts/schemas/com-cluster-recordsgovernance-governedrecordstatuschanged-v1.schema.json
  - owner: M02
    class: RecordHoldChangedV1
    type: com.cluster.recordsgovernance.recordholdchanged.v1
    schema: docs/contracts/schemas/com-cluster-recordsgovernance-recordholdchanged-v1.schema.json
  - owner: M02
