# Cluster Planned-Module Contracts Baseline (M00)
#
# Source-grounded freeze of the seven planned modules. Every entry below is
# derived from current source on the working tree; nothing here is invented.
# Approved source: docs/superpowers/specs/2026-07-26-cluster-production-and-modules-program-design.md
# Architecture test surfaces: apps/api/tests/Architecture/ModuleBoundariesTest.php
#   - MODULE_RANKS         rank per module (Shared=-1, ..., Workspace=11)
#   - PLANNED_MODULES      list of 7 not-yet-implemented module names
#   - TABLE_OWNERS         exact migrated-table ownership
#
# This file is documentation only. It does not create routes, controllers,
# migrations, or generated-client output. M00 freezes the contract surface
# so M01..M07 may implement in parallel without colliding on shared names.

version: 1
baseline_date: '2026-07-27'
source_commit: df2588c  # the architecture-closure verification sha
