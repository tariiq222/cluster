# ----------------------------------------------------------------------------
# 5. Classification (M00 plan §8.4)
# ----------------------------------------------------------------------------
classification:
  M01_Audit:
    contains_phi: true
    contains_pii: true
    classification: confidential
    rationale: |
      IDs and access metadata are Confidential and may be PHI-linked.
      audit_events stores no raw source payload, free-text clinical content,
      secrets, tokens, or before/after object dumps. Export is capability-
      gated, audited, time-bounded, and redacted by field policy.
  M02_RecordsGovernance:
    contains_phi: true
    contains_pii: true
    classification: confidential
    rationale: |
      Source references, holds, and disposition state are Confidential and
      may be PHI-linked. The module stores governance metadata only, never
      the governed source payload.
  M03_Collaboration:
    contains_phi: true
    contains_pii: true
    classification: confidential
    rationale: |
      Thread/comment classification inherits the subject ceiling. Comment
      and revision bodies are PHI-capable free text: encrypt at rest, mask
      by authorization, exclude from Events/logs/errors/browser persistence,
      and audit every sensitive read/export. Mention events contain IDs and
      classification only.
  M04_Strategy:
    contains_phi: false
    contains_pii: true
    classification: confidential
    rationale: |
      Strategy metadata is Confidential business data. Direct PHI is
      prohibited; evidence is an opaque Documents reference and names/notes
      must reject patient identifiers by product policy.
  M05_PortfolioProjects:
    contains_phi: false
    contains_pii: true
    classification: confidential
    rationale: |
      Portfolio/project metadata is Confidential business data. Direct PHI
      is prohibited; evidence is an opaque Documents reference.
  M06_Risk:
    contains_phi: false
    contains_pii: true
    classification: confidential
    rationale: |
      Enterprise risk metadata is Confidential. Direct patient/case PHI is
      prohibited; evidence is an opaque Documents reference. Clinical-case
      tracking requires a separately approved module/contract, not free text
      in Risk.
  M07_Workspace:
    contains_phi: false
    contains_pii: true
    classification: confidential
    rationale: |
      user_id and preferences are PII, not PHI. Workspace stores
      layout/preferences only and never caches producer facts, PHI, query
      results, or same-rank module data.
  global_rule: |
    PHI/PII never appears in a URL, cursor plaintext, idempotency
    fingerprint output, problem response, correlation metadata,
    unsanitized log, browser local/session storage, or event payload.
    P04 reviews M01/M02/M03 enforcement after their implementation; that is
    a completion-phase gate for P04, not an M00 start dependency.

# ----------------------------------------------------------------------------
# 6. Migration order (M00 plan §8.3)
# ----------------------------------------------------------------------------
migration_order:
  serial_registry_order:
    - M01
    - M02
    - M03
    - M04
    - M05
    - M06
    - M07
  within_module_rule: |
    Create parent/version tables before child/history tables, then
    idempotency tables; create internal FKs and unique indexes only after
    both owner-local tables exist.
  cutover_rule: |
    A module's runtime MODULE-REGISTRY cutover is indivisible and, in one
    integration change:
    1. adds the real module directory and provider/runtime implementation;
    2. creates all and only its real reversible migrations;
    3. adds only those migrations to module_migrations.php in owner-local order;
    4. proves its existing fixed MODULE_RANKS entry is unchanged;
    5. removes only that module from PLANNED_MODULES;
    6. adds exactly its frozen, actually created tables to TABLE_OWNERS;
    7. proves fresh migrate and disposable up/down behavior; and
    8. rejects missing owners, premature PLANNED_MODULES removal, premature
       or ghost table owners, a registry-only cutover, a module directory
       without all owned migrations, and any planned-list/table-owner
       mutation whose module directory and owned migrations are not present
       in the same integrated change.
  parallel_branches_allowed: true
  registry_token_concurrency: never_concurrent

# ----------------------------------------------------------------------------
# 7. Integration queues (M00 plan §12)
# ----------------------------------------------------------------------------
# One token has one granted holder. A token grant records token, state,
# requesting plan, releasing owner, full base commit, exact surface, grant
# evidence, expiry, and merge commit/result. A module is not completed until
# its required tokens are processed and final tests pass on the integrated
# commit.
integration_queues:
  shared_queue_order: [M01, M02, M03, M04, M05, M06, M07]
  tokens:
    - name: MODULE-REGISTRY
      surface: 'apps/api/tests/Architecture/ModuleBoundariesTest.php::MODULE_RANKS; ::PLANNED_MODULES; ::TABLE_OWNERS; docs/architecture/module-catalog.md; real module directory; real migration manifest'
      m00_rule: |
        M00 freezes all seven planned ranks in advance. One module at a time
        later applies its indivisible directory+migrations+manifest+
        planned-list removal+table-owner cutover without changing any rank.
        No premature implementation status or table ownership.
      holder: rotating
      granted_to: []
    - name: API-ROUTES
      surface: apps/api/routes/web.php
      m00_rule: |
        Later module route integration only after active closure route
        ownership is released.
      holder: rotating
      granted_to: []
    - name: OPENAPI
      surface: docs/contracts/api/openapi.yaml
      m00_rule: |
        Later module reconciles only its frozen namespace after T12 handoff.
      holder: rotating
      granted_to: []
    - name: ORVAL
      surface: 'generated bundles; apps/web/src/api/generated/cluster.ts'
      m00_rule: |
        Same holder as OPENAPI; generation command only, never hand editing.
      holder: same_as_OPENAPI
      granted_to: []
    - name: WEB-SHELL
      surface: 'typed web routes/navigation'
      m00_rule: |
        Serial module queue; M07 owns only the final aggregation token.
      holder: rotating
      granted_to: []
    - name: DOCUMENTS-LINKED-FACTS
      surface: 'Documents-owned LinkedResourceAuthorizationFacts composite/provider binding'
      m00_rule: |
        M03 produces an exact integration packet; the Documents owner alone
        applies it after current-plan release. M03 never edits Documents
        provider bindings.
      holder: documents_owner
      granted_to: []
    - name: COLLABORATION-SHARED-RELAY
      surface: 'Shared-owned bounded relay/command/provider/tests for the three M03 event types'
      m00_rule: |
        M03 produces an exact integration packet; the Shared outbox owner
        alone applies it before Notifications consumes the streams or P01
        dispatches either command. M03 never edits Shared outbox internals.
      holder: shared_outbox_owner
      granted_to: []
    - name: NOTIFICATIONS-COLLABORATION-CONSUMER
      surface: 'Notifications-owned Collaboration event consumer/provider binding'
      m00_rule: |
        M03 produces an exact integration packet; the Notifications owner
        alone applies it, then requests PROD-WORKLOAD-REGISTRY. M03 never
        edits Notifications internals.
      holder: notifications_owner
      granted_to: []
    - name: CLOSURE-CI
      surface: 'Makefile; .github/workflows/ci.yml; .github/workflows/ci-e2e.yml'
      m00_rule: |
        P08 only after Task 13 handoff; M00 never owns it.
      holder: p08_after_T13_handoff
      granted_to: []
  downstream_phase_gates:
    M01_start: 'M00 approved plus ARCHITECTURE-CLOSURE:AUTHORIZATION-OUTBOX; sensitive_access_events transfer remains a distinct explicit handoff.'
    M02_core_start: 'M00 approved; final Audit integration remains blocked on M01.'
    M03_core_start: 'M00 approved; final RecordsGovernance integration remains blocked on M02. M03 publishes immutable DOCUMENTS-LINKED-FACTS, COLLABORATION-SHARED-RELAY, and NOTIFICATIONS-COLLABORATION-CONSUMER packets; only the Documents, Shared outbox, and Notifications owners respectively apply them.'
    M04_core_start: 'M00 approved; final RecordsGovernance integration remains blocked on M02.'
    M05_core_start: 'M00 approved with test fakes allowed; final Strategy integration remains blocked on M04.'
    M06_core_start: 'M00 approved with test fakes allowed; final Strategy/PortfolioProjects integration remains blocked on M04 and M05.'
    M07_core_start: 'M00 approved with six test fakes allowed; final aggregation remains blocked on M01-M06. Same-rank modules remain web-composed.'

