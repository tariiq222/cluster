  api: /api/v1/collaboration
  openapi: /collaboration
  web: /collaboration
event_token: collaboration

# ---- Owned tables (exact ordered set) ---------------------------------------
owned_tables:
  - collaboration_threads
  - collaboration_thread_memberships
  - collaboration_comments
  - collaboration_mentions
  - collaboration_comment_revisions
  - collaboration_moderation_actions
  - collaboration_idempotency_keys

# ---- Capabilities (exact set, exact order) ----------------------------------
capabilities:
  - collaboration.thread.create
  - collaboration.thread.read
  - collaboration.thread.list
  - collaboration.thread.update
  - collaboration.thread.archive
  - collaboration.membership.manage
  - collaboration.comment.create
  - collaboration.comment.edit
  - collaboration.comment.moderate

# ---- Public Contracts (exact signatures) ------------------------------------
public_contracts:
  - name: OpenCollaborationThread
    signature: 'open(CollaborationThreadRegistration $registration): CollaborationThreadReference'
  - name: ListVisibleCollaborationThreads
    signature: 'list(CollaborationThreadQuery $query): CollaborationThreadPage'

# ---- Public DTOs (exact set) ------------------------------------------------
public_dtos:
  - CollaborationThreadRegistration
  - CollaborationThreadReference
  - CollaborationThreadQuery
  - CollaborationThreadSummary
  - CollaborationThreadPage

# ---- Events -----------------------------------------------------------------
events:
  - class: CommentPublishedV1
    type: com.cluster.collaboration.commentpublished.v1
    schema: docs/contracts/schemas/com-cluster-collaboration-commentpublished-v1.schema.json
  - class: MentionCreatedV1
    type: com.cluster.collaboration.mentioncreated.v1
    schema: docs/contracts/schemas/com-cluster-collaboration-mentioncreated-v1.schema.json
  - class: ThreadVisibilityChangedV1
    type: com.cluster.collaboration.threadvisibilitychanged.v1
    schema: docs/contracts/schemas/com-cluster-collaboration-threadvisibilitychanged-v1.schema.json

# ---- Classification ---------------------------------------------------------
classification:
  contains_phi: true
  contains_pii: true
  label: confidential_phi_capable_free_text
  rationale: |
    Thread/comment classification inherits the subject ceiling. Comment
    and revision bodies are PHI-capable free text: encrypt at rest, mask
    by authorization, exclude from Events/logs/errors/browser persistence,
    and audit every sensitive read/export. Mention events contain IDs and
    classification only.

# ---- Idempotency / concurrency ---------------------------------------------
idempotency_mode: server_replay_with_idempotency_key
concurrency_mode: optimistic_lock_version_with_cas

# ---- Test fakes ------------------------------------------------------------
test_fake_allowed: false
test_fake_rule: null

# ---- Required integration tokens -------------------------------------------
required_integration_tokens:
  - MODULE-REGISTRY
  - API-ROUTES
  - OPENAPI
  - ORVAL
  - WEB-SHELL
  - DOCUMENTS-LINKED-FACTS
  - COLLABORATION-SHARED-RELAY
  - NOTIFICATIONS-COLLABORATION-CONSUMER

# ---- Owning packets (M03 publishes; named owners apply) --------------------
owning_packets:
  - |
    M03 publishes immutable DOCUMENTS-LINKED-FACTS,
    COLLABORATION-SHARED-RELAY, and NOTIFICATIONS-COLLABORATION-CONSUMER
    packets. Only the Documents, Shared outbox, and Notifications owners
    respectively apply them. M03 never edits Documents provider bindings,
    Shared outbox internals, or Notifications internals.

# ---- Producer / cross-module blockers --------------------------------------
producer_blockers:
  final_records_governance_integration: |
    Final RecordsGovernance (M02) integration remains blocked on M02.
  documents_integration: |
    DOCUMENTS-LINKED-FACTS integration packet is produced by M03 but only
    the Documents owner may apply it.
  shared_outbox_integration: |
    COLLABORATION-SHARED-RELAY integration packet is produced by M03 but
    only the Shared outbox owner may apply it, before Notifications consumes
    the streams or P01 dispatches either command.
  notifications_integration: |
    NOTIFICATIONS-COLLABORATION-CONSUMER integration packet is produced by
    M03 but only the Notifications owner may apply it, then requests
    PROD-WORKLOAD-REGISTRY.

