canonical_source: docs/architecture/planned-module-contracts.yaml
plan: docs/superpowers/plans/2026-07-26-cluster-risk-module.md

# ---- Rank -------------------------------------------------------------------
rank: 10

# ---- Prefixes (frozen) ------------------------------------------------------
prefixes:
  api: /api/v1/risk
  openapi: /risk
  web: /risk
event_token: risk

# ---- Owned tables (exact ordered set) ---------------------------------------
owned_tables:
  - risk_registers
  - risk_policy_versions
  - risks
  - risk_assessments
  - risk_controls
  - risk_treatments
  - risk_treatment_actions
  - risk_reviews
  - risk_indicators
  - risk_indicator_readings
  - risk_idempotency_keys

# ---- Capabilities (exact set, exact order) ----------------------------------
capabilities:
  - risk.risk.read
  - risk.risk.manage
  - risk.assess
  - risk.control.manage
  - risk.treatment.manage
  - risk.accept
  - risk.kri.manage

# ---- Public Contracts (exact signatures) ------------------------------------
public_contracts:
  - name: ResolveRiskReference
    signature: 'resolve(RiskAccessContext $context, string $riskId): ?RiskReference'
  - name: QueryRiskWorkspaceItems
    signature: 'query(RiskWorkspaceQuery $query): RiskWorkspacePage'

# ---- Public DTOs (exact set) ------------------------------------------------
public_dtos:
  - RiskAccessContext
  - RiskReference
  - RiskWorkspaceQuery
  - RiskWorkspaceItem
  - RiskWorkspacePage

# ---- Events -----------------------------------------------------------------
events:
  - class: RiskChangedV1
    type: com.cluster.risk.riskchanged.v1
    schema: docs/contracts/schemas/com-cluster-risk-riskchanged-v1.schema.json
  - class: RiskReviewDueV1
    type: com.cluster.risk.riskreviewdue.v1
    schema: docs/contracts/schemas/com-cluster-risk-riskreviewdue-v1.schema.json
  - class: RiskTreatmentActionDueV1
    type: com.cluster.risk.risktreatmentactiondue.v1
    schema: docs/contracts/schemas/com-cluster-risk-risktreatmentactiondue-v1.schema.json

# ---- Classification ---------------------------------------------------------
classification:
  contains_phi: false
  contains_pii: true
  label: confidential_business_no_phi
  rationale: |
    Enterprise risk metadata is Confidential. Direct patient/case PHI is
    prohibited; evidence is an opaque Documents reference. Clinical-case
    tracking requires a separately approved module/contract, not free text
    in Risk.

# ---- Idempotency / concurrency ---------------------------------------------
idempotency_mode: server_replay_with_idempotency_key
concurrency_mode: optimistic_lock_version_with_cas

# ---- Test fakes ------------------------------------------------------------
test_fake_allowed: true
test_fake_rule: |
  M06 may build module-owned cores against deterministic in-memory fakes
  for the frozen lower-rank contracts while its producer integrations are
  blocked. Same restrictions as M05.

# ---- Required integration tokens -------------------------------------------
required_integration_tokens:
  - MODULE-REGISTRY
  - API-ROUTES
  - OPENAPI
  - ORVAL
  - WEB-SHELL

# ---- Public-port restriction -----------------------------------------------
no_tasks_public_port: |
  M06 does not add a Tasks public port under Risk ownership. Due review
  and treatment-action work remains Risk-owned and is exposed through
  Risk queries/routes. A future Tasks integration requires a separate
  approved producer-owned contract amendment and token.

# ---- Producer / cross-module blockers --------------------------------------
producer_blockers:
  final_strategy_integration: |
    Final Strategy (M04) integration remains blocked on M04.
  final_portfolio_projects_integration: |
    Final PortfolioProjects (M05) integration remains blocked on M05.

