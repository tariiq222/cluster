  DOCUMENTS_QUARANTINE_AWS_DEFAULT_REGION: ${DOCUMENTS_QUARANTINE_AWS_DEFAULT_REGION:?DOCUMENTS_QUARANTINE_AWS_DEFAULT_REGION is required}
