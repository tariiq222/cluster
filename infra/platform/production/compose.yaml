x-api-environment: &api-environment
  APP_NAME: Third Health Cluster Platform
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
  APP_LOCALE: ar
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: predis
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  REDIS_PREFIX: ${REDIS_PREFIX:-cluster_}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  BROADCAST_CONNECTION: log
  OUTBOX_RELAY_BATCH_SIZE: "100"
  NOTIFICATIONS_STREAM_BATCH_SIZE: "100"

x-api-common: &api-common
  image: ${API_IMAGE:-cluster-api:local}
  build:
    context: ../../../apps/api
    dockerfile: Dockerfile
  environment: *api-environment
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - app
  volumes:
    - app-storage:/var/www/html/storage/app
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0770
    - /var/www/html/storage/framework:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0770
    - /var/www/html/storage/logs:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0770
  init: true
  stop_grace_period: 20s

services:
  caddy:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-cluster-web:local}
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0770
    init: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  api:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket=@fsockopen('127.0.0.1',9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *api-common
    command: ["/usr/local/bin/worker-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/worker.ready') && time() - filemtime('/tmp/worker.ready') < 30 ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  migrate:
    <<: *api-common
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    healthcheck:
      disable: true

networks:
  app: {}

volumes:
  app-storage: {}
  caddy-data: {}
  caddy-config: {}
