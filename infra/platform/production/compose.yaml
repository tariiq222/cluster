  DOCUMENTS_QUARANTINE_AWS_ENDPOINT: ${DOCUMENTS_QUARANTINE_AWS_ENDPOINT:-}
  DOCUMENTS_QUARANTINE_AWS_USE_PATH_STYLE_ENDPOINT: ${DOCUMENTS_QUARANTINE_AWS_USE_PATH_STYLE_ENDPOINT:-false}
  DOCUMENTS_QUARANTINE_KMS_KEY_ID: ${DOCUMENTS_QUARANTINE_KMS_KEY_ID:?DOCUMENTS_QUARANTINE_KMS_KEY_ID is required}
