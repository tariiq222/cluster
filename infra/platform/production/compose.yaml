x-api-environment: &api-environment
  APP_NAME: Third Health Cluster Platform
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_LOCALE: ar
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-cluster}
  DB_USERNAME: ${DB_USERNAME:-cluster}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: predis
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  BROADCAST_CONNECTION: log
  OUTBOX_RELAY_BATCH_SIZE: "100"
  NOTIFICATIONS_STREAM_BATCH_SIZE: "100"

x-api-common: &api-common
  image: ${API_IMAGE:?API_IMAGE must be a sha256-pinned image reference}
  pull_policy: never
  environment: *api-environment
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0770
    - /var/www/html/storage:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0770
  init: true
  stop_grace_period: 20s

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a sha256-pinned image reference}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8080}:8080"
    networks:
      - frontend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0770
    init: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  api:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - frontend
      - state
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket=@fsockopen('127.0.0.1',9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *api-common
    command: ["/usr/local/bin/worker-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    networks:
      - state
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/worker.ready') && time() - filemtime('/tmp/worker.ready') < 30 ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  scheduler:
    <<: *api-common
    command: ["/usr/local/bin/scheduler-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - state
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/scheduler.ready') && time() - filemtime('/tmp/scheduler.ready') < 120 ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 30s

  migrate:
    <<: *api-common
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - state

  mysql:
    image: docker.io/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cluster}
      MYSQL_USER: ${DB_USERNAME:-cluster}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  valkey:
    image: docker.io/valkey/valkey:8.1.1@sha256:a19bebed6a91bd5e6e2106fef015f9602a3392deeb7c9ed47548378dcee3dfc2
    pull_policy: never
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey-data:/data
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping | grep -Fxq PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  frontend: {}
  state:
    internal: true

volumes:
  mysql-data: {}
  valkey-data: {}
