  DOCUMENTS_AVAILABLE_AWS_SECRET_ACCESS_KEY: ${DOCUMENTS_AVAILABLE_AWS_SECRET_ACCESS_KEY:?DOCUMENTS_AVAILABLE_AWS_SECRET_ACCESS_KEY is required}
  DOCUMENTS_AVAILABLE_AWS_DEFAULT_REGION: ${DOCUMENTS_AVAILABLE_AWS_DEFAULT_REGION:?DOCUMENTS_AVAILABLE_AWS_DEFAULT_REGION is required}
  DOCUMENTS_AVAILABLE_AWS_BUCKET: ${DOCUMENTS_AVAILABLE_AWS_BUCKET:?DOCUMENTS_AVAILABLE_AWS_BUCKET is required}
  DOCUMENTS_AVAILABLE_AWS_ENDPOINT: ${DOCUMENTS_AVAILABLE_AWS_ENDPOINT:-}
  DOCUMENTS_AVAILABLE_AWS_USE_PATH_STYLE_ENDPOINT: ${DOCUMENTS_AVAILABLE_AWS_USE_PATH_STYLE_ENDPOINT:-false}
  DOCUMENTS_AVAILABLE_KMS_KEY_ID: ${DOCUMENTS_AVAILABLE_KMS_KEY_ID:?DOCUMENTS_AVAILABLE_KMS_KEY_ID is required}

x-api-common: &api-common
  image: ${API_IMAGE:-cluster-api:local}
  build:
    context: ../../../apps/api
    dockerfile: Dockerfile
  environment: *api-environment
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - app
  volumes:
    - app-storage:/var/www/html/storage/app
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0770
    # read_only rootfs: Laravel regenerates the package manifest in
    # bootstrap/cache on boot (PackageManifest::config); give it a writable
    # scratch mount like the storage framework mounts.
    - /var/www/html/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0770
    - /var/www/html/storage/framework:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0770
    - /var/www/html/storage/logs:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0770
  init: true
  stop_grace_period: 20s

services:
  caddy:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-cluster-web:local}
    build:
      # Repo root: SwaggerUiScreen imports docs/contracts/api/openapi.yaml
      # relative to the source tree, which escapes an apps/web-only context.
      context: ../../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0770
    init: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  api:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket=@fsockopen('127.0.0.1',9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *api-common
    command: ["/usr/local/bin/worker-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/worker.ready') && time() - filemtime('/tmp/worker.ready') < 30 ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Scheduler runs Laravel's `php artisan schedule:run` every minute. The
  # api/worker services are not responsible for cron jobs; this dedicated
  # service consumes the scheduler-loop.sh binary already installed in
  # apps/api/Dockerfile. Starts only if a scheduled task is registered
  # in routes/console.php or in the application bootstrap.
  scheduler:
    <<: *api-common
    command: ["/usr/local/bin/scheduler-loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/tmp/scheduler.ready') && time() - filemtime('/tmp/scheduler.ready') < 90 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  migrate:
    <<: *api-common
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    healthcheck:
      disable: true

networks:
  app: {}

volumes:
  app-storage: {}
  caddy-data: {}
  caddy-config: {}
