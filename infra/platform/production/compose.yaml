  DOCUMENTS_S3_REGION: ${DOCUMENTS_S3_REGION:?DOCUMENTS_S3_REGION is required}
  DOCUMENTS_S3_ENDPOINT: ${DOCUMENTS_S3_ENDPOINT:-}
  DOCUMENTS_S3_USE_PATH_STYLE: ${DOCUMENTS_S3_USE_PATH_STYLE:-false}
  DOCUMENTS_S3_QUARANTINE_BUCKET: ${DOCUMENTS_S3_QUARANTINE_BUCKET:?DOCUMENTS_S3_QUARANTINE_BUCKET is required}
  DOCUMENTS_S3_AVAILABLE_BUCKET: ${DOCUMENTS_S3_AVAILABLE_BUCKET:?DOCUMENTS_S3_AVAILABLE_BUCKET is required}
