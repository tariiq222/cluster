services:
  api:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${TEST_MYSQL_PORT:?TEST_MYSQL_PORT is required}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}

  worker:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${TEST_MYSQL_PORT:?TEST_MYSQL_PORT is required}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}

  migrate:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${TEST_MYSQL_PORT:?TEST_MYSQL_PORT is required}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: docker.io/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cluster}
      MYSQL_USER: ${DB_USERNAME:-cluster}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "${TEST_MYSQL_PORT:?TEST_MYSQL_PORT is required}:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: docker.io/library/redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}:6379"
    volumes:
      - redis-test-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -Fxq PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql-test-data: {}
  redis-test-data: {}
