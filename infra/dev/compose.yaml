services:
  mysql:
    image: docker.io/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_DATABASE: ${W1_1_MYSQL_DATABASE:-cluster}
      MYSQL_ROOT_PASSWORD: ${W1_1_MYSQL_ROOT_PASSWORD:-local-dev-root}
      MYSQL_USER: ${W1_1_MYSQL_USER:-cluster}
      MYSQL_PASSWORD: ${W1_1_MYSQL_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:${W1_1_MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: docker.io/library/redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${W1_1_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  mysql-data: {}
  redis-data: {}
