name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - run: composer --working-dir=apps/api validate --strict
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=apps/api lint
      - run: composer --working-dir=apps/api analyse
      - run: composer --working-dir=apps/api audit --locked
      - run: make test-api
      - run: make verify-boundaries

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test-web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: ./scripts/validate-docs.sh
      - run: python -m mkdocs build --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
