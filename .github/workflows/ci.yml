name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make verify-intake

  contracts:
    needs: [intake]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make api:check

  api-static:
    needs: [intake]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, gd, zip, pcntl
          coverage: none
          tools: composer:v2
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: make verify-boundaries
      - run: make lint-api
      - run: make analyse-api

  web-static:
    needs: [intake]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run build

  secrets:
    needs: [intake]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  api-unit:
    needs: [api-static]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, gd, zip, pcntl
          coverage: none
          tools: composer:v2
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: make test-api

  web-unit:
    needs: [web-static]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test-web-unit

  mysql-integration:
    needs: [contracts]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, gd, zip, pcntl
          coverage: none
          tools: composer:v2
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: make verify-mysql-integration

  npm-audit:
    needs: [web-static]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make npm-audit

  architecture-closure:
    needs: [api-unit, web-unit, mysql-integration]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, gd, zip, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: npm --prefix apps/web ci
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: make verify-architecture-closure

  production-bundle:
    needs: [api-unit, web-unit, secrets, mysql-integration, npm-audit, architecture-closure]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - run: make verify-w1-1-local
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
