name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - run: composer --working-dir=apps/api validate --strict
      - run: composer --working-dir=apps/api install --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=apps/api lint
      - run: composer --working-dir=apps/api analyse
      - run: composer --working-dir=apps/api audit --locked
      - run: make test-api
      - run: make verify-boundaries

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test-web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: ./scripts/validate-docs.sh
      - run: python -m mkdocs build --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  production-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - run: make verify-w1-1-local
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
