[project]
name = "cluster-coding-gateway"
version = "0.1.0"
description = "Local OpenAI-compatible coding gateway for the Cluster repository"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3"
]

[project.scripts]
cluster-coding-gateway = "gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
