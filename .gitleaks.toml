[extend]
useDefault = true

[[allowlists]]
description = "Historical SHA-256 manifest false positives"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["b0938fd4c1061a944acb86d65b963682f47bbb81"]
paths = ['''^\.opencode/gsd-file-manifest\.json$''']
regexTarget = "line"
regexes = [
  '''^[[:space:]]*"gsd-core/bin/lib/api-coverage\.cjs": "df26cbfce51c8ed7f2e6f78ba5be354db99afe0f6734256e365dba6001ba5a13",$''',
  '''^[[:space:]]*"gsd-core/bin/lib/secrets\.cjs": "02b42408bba154f20bd0d64fa737071f54baa5f0cc89319f114d439e779a0806",$''',
  '''^[[:space:]]*"gsd-core/references/api-coverage\.md": "205a43c5fa7c221c476f10b59590aea8e45c44ed1c2c8bae76be47f5ba7d734a",$''',
]

[[allowlists]]
description = "Historical stack terminology false positive"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["84763f4bb242b47db2eb69ef5de02a7f1c6fdca1"]
paths = ['''^\.planning/research/STACK\.md$''']

[[allowlists]]
description = "Day 2 HTTP journey test idempotency keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/api/tests/Feature/Day2HttpVerticalTest\.php$''']
regexTarget = "match"
regexes = ['''Idempotency-Key' => 'day2-[a-z0-9-]+''']

[[allowlists]]
description = "W1.2 E2E required environment variable name list"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/e2e/w1-2-cookie-csrf\.spec\.ts$''']
regexTarget = "match"
regexes = ['''W1_2_[A-Z_0-9]+',\s+'W1_2_[A-Z_0-9]+''']

[[allowlists]]
description = "Historical Valkey terminology in removed agent artifacts"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["04b1a0478d72669a029697d04bf30d71db02e0ae"]
paths = [
  '''^\.pi-subagents/artifacts/be64518a_reviewer_1_output\.md$''',
  '''^\.pi-subagents/artifacts/be64518a_reviewer_1_transcript\.jsonl$''',
]
regexTarget = "match"
regexes = ['''^Valkey, .+''']

[[allowlists]]
description = "Deleted transient local runtime state from historical WIP commits"
targetRules = ["generic-api-key"]
condition = "OR"
paths = [
  '''^artifacts/local-live/sessions/[^/]+$''',
  '''^\.superpowers/brainstorm/[0-9]+-[0-9]+/state/server-info$''',
]
